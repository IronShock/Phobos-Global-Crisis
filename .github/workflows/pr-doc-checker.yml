name: Pull Request Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Documentation-Check:
    name: Documentation Requirements
    # If the Minor label is set, then workflow will not be executed
    if: false == contains(github.event.pull_request.labels.*.name, 'Minor')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changelog, credits, and documentation updates
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          git diff --name-only -z "$merge_base" HEAD > "$changed_files"

          changelog_updated=false
          credits_updated=false
          documentation_updated=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/Whats-New.md) changelog_updated=true ;;
              CREDITS.md) credits_updated=true ;;
              docs/New-or-Enhanced-Logics.md|docs/Fixed-or-Improved-Logics.md|docs/AI-Scripting-and-Mapping.md|docs/User-Interface.md|docs/Miscellanous.md)
                documentation_updated=true ;;
            esac
          done < "$changed_files"

          missing=0
          if [ "$changelog_updated" = true ]; then
            echo "Thank you for remembering to update the Changelog! 😋"
          else
            echo "::error::Please mention your changes in 'docs/Whats-New.md' or use the Minor label for your Pull Request."
            missing=1
          fi
          if [ "$credits_updated" = true ]; then
            echo "Thank you for remembering to update the Credits List! 😋"
          else
            echo "::error::Please mention your contribution in 'CREDITS.md' or use the Minor label for your Pull Request."
            missing=1
          fi
          if [ "$documentation_updated" = true ]; then
            echo "Thank you for remembering to add your changes to the docs! 😋"
          else
            echo "::error::Please document your changes or use the Minor label for your Pull Request."
            missing=1
          fi
          exit "$missing"
